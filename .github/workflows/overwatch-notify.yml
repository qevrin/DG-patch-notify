name: Overwatch Patch Notes Notifier

on:
  schedule:
    # 매일 UTC 12:00 (한국시간 오후 9시)에 실행. 오버워치는 핫픽스가 불규칙하게
    # 자주 나와서 발로란트/배그보다 훨씬 자주(매일) 확인합니다.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        run: playwright install --with-deps chromium

      - name: 패치노트 확인 및 디스코드 전송
        env:
          DISCORD_WEBHOOK_OVERWATCH: ${{ secrets.DISCORD_WEBHOOK_OVERWATCH }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO_RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main/assets
        run: python scripts/check_patches.py overwatch

      - name: 상태 파일 커밋
        run: |
          git config user.name "patch-notify-bot"
          git config user.email "actions@github.com"
          git add state/state.json
          git diff --cached --quiet || git commit -m "chore: update patch state (overwatch)"
          git push
