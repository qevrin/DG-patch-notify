      - name: 파이썬 설치
        if: steps.biweekly.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        if: steps.biweekly.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        if: steps.biweekly.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: playwright install --with-deps chromium

      - name: 패치노트 확인 및 디스코드 전송
        if: steps.biweekly.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_VALORANT: ${{ secrets.DISCORD_WEBHOOK_VALORANT }}
          DISCORD_WEBHOOK_PUBG: ${{ secrets.DISCORD_WEBHOOK_PUBG }}
          DISCORD_WEBHOOK_VALORANT_ISSUES: ${{ secrets.DISCORD_WEBHOOK_VALORANT_ISSUES }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/check_patches.py

      - name: 상태 파일 커밋
        if: steps.biweekly.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "patch-notify-bot"
          git config user.email "actions@github.com"
          git add state/state.json
          git diff --cached --quiet || git commit -m "chore: update patch state"
          git push

