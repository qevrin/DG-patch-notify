name: Patch Notes Notifier

on:
  schedule:
    # 매주 화요일 UTC 12:00 (한국시간 오후 9시)에 트리거되지만,
    # 아래 "격주 여부 확인" 스텝에서 짝수 주에만 실제로 동작하도록 걸러냅니다.
    - cron: "0 12 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 격주 여부 확인
        id: biweekly
        run: |
          week=$(date -u +%V)
          if [ $((10#$week % 2)) -eq 0 ]; then
            echo "이번 주는 실행 대상 주입니다 (ISO 주차: $week)"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "이번 주는 건너뜁니다 (ISO 주차: $week, 다음 주에 실행됩니다)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 파이썬 설치
        if: steps.biweekly.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        if: steps.biweekly.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        if: steps.biweekly.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: playwright install --with-deps chromium

      - name: 패치노트 확인 및 디스코드 전송
        if: steps.biweekly.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_VALORANT: ${{ secrets.DISCORD_WEBHOOK_VALORANT }}
          DISCORD_WEBHOOK_PUBG: ${{ secrets.DISCORD_WEBHOOK_PUBG }}
          DISCORD_WEBHOOK_VALORANT_ISSUES: ${{ secrets.DISCORD_WEBHOOK_VALORANT_ISSUES }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/check_patches.py

      - name: 상태 파일 커밋
        if: steps.biweekly.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "patch-notify-bot"
          git config user.email "actions@github.com"
          git add state/state.json
          git diff --cached --quiet || git commit -m "chore: update patch state"
          git push
